[project]
name = "energy-gateway-mcp"
version = "0.1.0"
description = "Local MCP server exposing the SFOE public energy knowledge base via the Bedrock AgentCore Gateway"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.18.0",
]

[project.scripts]
energy-gateway-mcp = "energy_gateway_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_gateway_mcp"]
