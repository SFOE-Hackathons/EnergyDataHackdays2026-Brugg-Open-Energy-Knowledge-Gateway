[pytest]
# The offline unit suite. Restricting discovery is not cosmetic: pytest's
# default rules collect any test_*.py under the rootdir, which would pick up
# test_gateway.py at the repo root. That file is a live smoke test -- it
# demands Cognito credentials, calls deployed AWS infrastructure and costs
# real Bedrock retrievals -- so collecting it turns `pytest` from a
# millisecond offline check into a billed network round trip that fails on
# any machine without a .env.
testpaths = mcp-gateway/tests
