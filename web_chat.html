<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Energy Gateway</title>
  <style>
    :root { --ink:#17202a; --muted:#65727e; --paper:#fffdf8; --line:#d9dfdf; --accent:#0e7770; --accent-dark:#07564f; --warm:#f3b562; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#e8efeb; font-family:Georgia, 'Times New Roman', serif; }
    .shell { max-width:1100px; margin:0 auto; padding:44px 22px 64px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:34px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font:700 12px/1.2 system-ui,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0; max-width:700px; font-size:clamp(34px, 6vw, 68px); line-height:.98; font-weight:500; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font:14px system-ui,sans-serif; white-space:nowrap; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--warm); }
    .dot.ready { background:var(--accent); }
    .workspace { display:grid; grid-template-columns:minmax(0, 1fr) 260px; gap:20px; align-items:start; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 14px 35px #315d5217; }
    .composer { padding:18px; }
    textarea { display:block; width:100%; min-height:112px; resize:vertical; border:0; outline:0; background:transparent; color:var(--ink); font:22px/1.35 Georgia,serif; }
    textarea::placeholder { color:#9aa5a3; }
    .composer-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; border-top:1px solid var(--line); padding-top:14px; }
    .hint { color:var(--muted); font:13px system-ui,sans-serif; }
    button { border:0; border-radius:5px; padding:12px 18px; background:var(--accent); color:white; cursor:pointer; font:700 14px system-ui,sans-serif; }
    button:hover { background:var(--accent-dark); }
    button:disabled { opacity:.55; cursor:wait; }
    .response { margin-top:20px; padding:22px; min-height:180px; }
    .response h2, .sources h2 { margin:0 0 14px; font-size:21px; font-weight:500; }
    .empty { color:var(--muted); font:15px/1.6 system-ui,sans-serif; }
    .answer { white-space:pre-wrap; font:17px/1.65 Georgia,serif; }
    .error { color:#9b3b29; white-space:pre-wrap; font:15px/1.5 system-ui,sans-serif; }
    .sources { padding:18px; }
    .source { padding:12px 0; border-top:1px solid var(--line); }
    .source:first-of-type { border-top:0; }
    .source-title { font-weight:700; line-height:1.35; }
    .source-meta { margin-top:5px; color:var(--muted); font:12px/1.45 system-ui,sans-serif; }
    .source a { color:var(--accent-dark); overflow-wrap:anywhere; }
    .chip { display:inline-block; margin-top:10px; padding:4px 7px; background:#e4f0eb; color:var(--accent-dark); border-radius:4px; font:700 11px system-ui,sans-serif; }
    @media (max-width:760px) { header { display:block; } .status { margin-top:18px; } .workspace { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">SFOE / Open Energy Knowledge</p><h1>Ask the gateway.</h1></div>
      <div class="status"><span class="dot ready"></span>Local gateway connected</div>
    </header>
    <section class="workspace">
      <div>
        <form id="ask-form" class="panel composer">
          <textarea id="question" required placeholder="Ask a question about Swiss energy...">Welche Rolle spielt Wasserkraft in der Schweizer Stromversorgung?</textarea>
          <div class="composer-foot"><span class="hint">Retrieved passages and sources will appear here.</span><button id="ask-button" type="submit">Ask gateway</button></div>
        </form>
        <section class="panel response"><h2>Answer context</h2><div id="answer" class="empty">Your retrieved knowledge will appear after the first question.</div></section>
      </div>
      <aside class="panel sources"><h2>Sources</h2><div id="sources" class="empty">No sources yet.</div></aside>
    </section>
  </main>
  <script>
    const form = document.querySelector('#ask-form');
    const question = document.querySelector('#question');
    const button = document.querySelector('#ask-button');
    const answer = document.querySelector('#answer');
    const sources = document.querySelector('#sources');
    function esc(value) { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; }
    function render(data) {
      const results = data.result?.retrievalResults || [];
      answer.className = 'answer';
      answer.textContent = results.length ? results.map(item => item.content?.text || '').join('\n\n') : JSON.stringify(data.result, null, 2);
      sources.className = results.length ? '' : 'empty';
      sources.innerHTML = results.length ? results.map((item, index) => {
        const title = item.metadata?._document_title || item.documentId || 'Source document';
        const uri = item.location?.s3Location?.uri || item.metadata?._source_uri || '';
        const score = typeof item.score === 'number' ? `Relevance ${(item.score * 100).toFixed(1)}%` : '';
        return `<div class="source"><div class="source-title">${index + 1}. ${esc(title)}</div><div class="source-meta">${esc(score)}<br>${uri ? `<a href="${esc(uri)}" target="_blank" rel="noreferrer">${esc(uri)}</a>` : ''}</div></div>`;
      }).join('') : 'No sources returned.';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); button.disabled = true; button.textContent = 'Searching...'; answer.className = 'empty'; answer.textContent = 'Asking the gateway...'; sources.className = 'empty'; sources.textContent = 'Waiting for sources...';
      try {
        const response = await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:question.value}) });
        const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Gateway request failed'); render(data);
      } catch (error) { answer.className = 'error'; answer.textContent = error.message; sources.className = 'empty'; sources.textContent = 'No sources returned.'; }
      finally { button.disabled = false; button.textContent = 'Ask gateway'; }
    });
  </script>
</body>
</html>
